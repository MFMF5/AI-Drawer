<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DRAWER // ARTIFICIAL INTELLIGENCE CANVAS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">🎨 AI ÇİZİM ASİSTANI</div>
            
            <div class="ai-brain-card">
                <div class="brain-status active" id="brainStatus"></div>
                <div>
                    <div class="brain-title">Neural-Painter v2.0</div>
                    <div class="brain-sub" id="brainMood">Durum: Tuval Hazır</div>
                </div>
            </div>

            <div class="chat-wall" id="chatOutput">
                <div class="msg ai">
                    <strong>[AI]:</strong> Selam! Ben senin çizim asistanınım. Bana ne çizmemi istediğini söyleyebilirsin! 
                    <br><br><u>Örnek Komutlar:</u>
                    <br>• "Kırmızı bir kare çiz"
                    <br>• "Büyük mavi bir çember yap"
                    <br>• "Ekranı yeşile boya"
                    <br>• "Temizle"
                </div>
            </div>

            <div class="input-row">
                <input type="text" id="userInput" placeholder="AI'a çizim komutu ver..." autocomplete="off">
                <button id="sendBtn">ÇİZ</button>
            </div>
        </div>

        <div class="canvas-zone">
            <canvas id="paintCanvas"></canvas>
        </div>
    </div>

    <script src="ai-engine.js"></script>
    <script src="cursor.js"></script>
</body>
</html>
